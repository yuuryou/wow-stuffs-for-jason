    <!-- Liquid Glass SVG Refraction Filter (Level 3 - Chromium only) -->
    <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <filter id="liquid-glass-refract" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
                <feImage href="#lg-displacement" result="dm" />
                <!-- Chromatic aberration: red channel offset -->
                <feDisplacementMap in="SourceGraphic" in2="dm" scale="0" xChannelSelector="R" yChannelSelector="G" result="ca-r" />
                <feDisplacementMap in="SourceGraphic" in2="dm" scale="0" xChannelSelector="G" yChannelSelector="B" result="ca-gb" />
                <feBlend in="ca-r" in2="ca-gb" mode="screen" result="ca-merged" />
                <!-- Soft glow -->
                <feGaussianBlur in="ca-merged" stdDeviation="2" result="glow" />
                <feComposite in="glow" in2="SourceGraphic" operator="over" />
            </filter>
        </defs>
    </svg>
