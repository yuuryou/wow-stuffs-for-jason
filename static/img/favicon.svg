<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <radialGradient id="bg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0d0500"/>
            <stop offset="100%" stop-color="#050200"/>
        </radialGradient>
        <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF7D0A"/>
            <stop offset="100%" stop-color="#00FF96"/>
        </linearGradient>
    </defs>
    <circle cx="64" cy="64" r="62" fill="url(#bg)" stroke="#FF7D0A" stroke-width="2" opacity="0.8"/>
    <!-- Paw toes -->
    <ellipse cx="42" cy="44" rx="10" ry="13" fill="url(#pawGrad)" opacity="0.9"/>
    <ellipse cx="86" cy="44" rx="10" ry="13" fill="url(#pawGrad)" opacity="0.9"/>
    <ellipse cx="48" cy="30" rx="11" ry="14" fill="url(#pawGrad)" opacity="0.85"/>
    <ellipse cx="80" cy="30" rx="11" ry="14" fill="url(#pawGrad)" opacity="0.85"/>
    <!-- Main pad -->
    <ellipse cx="64" cy="72" rx="24" ry="20" fill="url(#pawGrad)" opacity="0.95"/>
    <!-- Claw marks -->
    <line x1="54" y1="68" x2="52" y2="58" stroke="#00FF96" stroke-width="1.5" opacity="0.5"/>
    <line x1="64" y1="64" x2="64" y2="52" stroke="#00FF96" stroke-width="1.5" opacity="0.5"/>
    <line x1="74" y1="68" x2="76" y2="58" stroke="#00FF96" stroke-width="1.5" opacity="0.5"/>
</svg>